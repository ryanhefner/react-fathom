version: 2.1

jobs:
  build-test-package:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout

      - run:
          name: Enable pnpm
          command: corepack enable

      - restore_cache:
          keys:
            - v3-pnpm-dependencies-{{ checksum "pnpm-lock.yaml" }}
            - v3-pnpm-dependencies-

      - run:
          name: Install workspace dependencies
          command: pnpm install --frozen-lockfile

      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: v3-pnpm-dependencies-{{ checksum "pnpm-lock.yaml" }}

      - run:
          name: Audit dependencies
          command: pnpm security:audit

      - run:
          name: Check formatting
          command: pnpm format:check

      - run:
          name: Lint
          command: pnpm lint

      - run:
          name: Test with coverage
          command: pnpm test:ci

      - run:
          name: Verify packed package
          command: pnpm release:smoke

      - run:
          name: Build documentation
          command: pnpm --dir docs build

  build-examples:
    docker:
      - image: cimg/node:24.21.0
    steps:
      - checkout

      - run:
          name: Enable pnpm
          command: corepack enable

      - restore_cache:
          keys:
            - v3-pnpm-dependencies-{{ checksum "pnpm-lock.yaml" }}
            - v3-pnpm-dependencies-

      - run:
          name: Install workspace dependencies
          command: pnpm install --frozen-lockfile

      - save_cache:
          paths:
            - ~/.local/share/pnpm/store
          key: v3-pnpm-dependencies-{{ checksum "pnpm-lock.yaml" }}

      - run:
          name: Build package
          command: pnpm build

      - run:
          name: Build browser examples
          command: |
            pnpm --dir examples/next-app build
            pnpm --dir examples/next-pages build
            pnpm --dir examples/react build
            pnpm --dir examples/tanstack-router build

      - run:
          name: Build Gatsby example
          command: |
            GATSBY_TELEMETRY_DISABLED=1 \
              XDG_CONFIG_HOME=/tmp/react-fathom-gatsby-config \
              pnpm --dir examples/gatsby build

      - run:
          name: Validate Expo example
          command: |
            pnpm --dir examples/react-native typecheck
            EXPO_NO_TELEMETRY=1 pnpm --dir examples/react-native build:web

# Invoke jobs via workflows
# See: https://circleci.com/docs/2.0/configuration-reference/#workflows
workflows:
  test-package:
    jobs:
      - build-test-package
      - build-examples

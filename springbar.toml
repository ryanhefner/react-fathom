task = []

[workspace]
name = "react-fathom"
tld = "test"
root_domain = "react-fathom"

[workspace.service_defaults]
package_manager = "npm"
mode = "lazy"

[derive]

[worktree]
copy = []
link = []
setup = []

[tasks]

[[unit]]
name = "react-fathom-docs"
working_dir = "docs"
command = "npm run dev"
package_manager = "npm"
port = 4810
hostnames = ["react-fathom.test"]
mode = "lazy"
subtype = "app"
role = "site"
source = "byo"
enabled = true
id = "unt_wks_workspace_users_ryanhefner_code_open_source_react_fathom_react_fathom_docs"

[unit.runtime]
kind = "node"
version = "22.15.1"
manager = "nvm"

[unit.launch]
application = "react-fathom-docs"
target = "server"
surface = "web"
framework = "nextjs"

